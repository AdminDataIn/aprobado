<header class="barra-prestadores">
  <a class="marca-prestadores" href="{% url 'contractors:solicitar' %}">Aprobado</a>
  <nav>
    <a href="{% url 'contractors:solicitar' %}">Solicitar</a>
    <a href="{% url 'contractors:mi_credito' %}">Mi credito</a>
    {% if request.user.is_authenticated %}
      <span class="usuario">{{ request.user.email|default:request.user.username }}</span>
      <a href="/accounts/logout/">Cerrar sesion</a>
    {% else %}
      <a href="/auth/login/">Iniciar sesion</a>
    {% endif %}
  </nav>
</header>
