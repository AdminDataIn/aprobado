<style>
  .contractors-footer-simple {
    background: #f8fafc;
    padding: 3rem 1rem 1.5rem;
    border-top: 1px solid #e5e7eb;
  }

  .contractors-footer-simple-inner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    text-align: left;
  }

  .contractors-footer-logo img {
    height: 42px;
    width: auto;
    display: block;
  }

  .contractors-footer-left {
    display: grid;
    gap: 1rem;
    justify-items: start;
  }

  .contractors-footer-copy,
  .contractors-footer-institutional {
    color: #334155;
    margin: 0;
    line-height: 1.55;
    font-weight: 400;
  }

  .contractors-footer-copy {
    max-width: 680px;
  }

  .contractors-footer-institutional {
    grid-column: 1 / -1;
    width: 100%;
    padding-top: 1.5rem;
    border-top: 1px solid #e5e7eb;
    text-align: center;
    color: #64748b;
  }

  .contractors-footer-contact,
  .contractors-footer-social {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .contractors-footer-social {
    align-self: start;
    justify-self: end;
  }

  .contractors-footer-contact {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.75rem;
  }

  .contractors-footer-contact a {
    color: #334155;
    text-decoration: none;
    font-weight: 500;
  }

  .contractors-footer-contact-item {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
  }

  .contractors-footer-contact-item svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
    color: #475569;
    flex: 0 0 auto;
  }

  .contractors-footer-icon {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #334155;
    background: #ffffff;
    border: 1px solid #dbe3ec;
    transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }

  .contractors-footer-icon:hover {
    background: #16b8d3;
    color: #ffffff;
    transform: translateY(-1px);
  }

  .contractors-footer-icon svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  @media (max-width: 720px) {
    .contractors-footer-simple-inner {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .contractors-footer-left,
    .contractors-footer-social {
      justify-self: center;
      justify-items: center;
    }

    .contractors-footer-contact {
      align-items: center;
    }
  }
</style>
