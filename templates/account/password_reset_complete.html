{% extends "account/_base.html" %}

{% block title %}Contraseña actualizada - Aprobado{% endblock %}

{% block content %}
{% include "account/_auth_content_styles.html" %}
<main class="section-main">
  <section class="hero-section-account">
    <div class="container-account">
      <div class="div-card-agent-account is-status-card">
        <div class="auth-status-icon is-success">&#10003;</div>
        <div class="mb-3"><span class="badge rounded-pill border">Contraseña actualizada</span></div>
        <h1>Contraseña actualizada</h1>
        <p class="auth-desc">Ya puedes ingresar nuevamente a tu cuenta.</p>
        <a href="{% url 'account_login' %}?next={{ auth_next_url|urlencode }}" class="btn-account">Ir al acceso</a>
      </div>
    </div>
  </section>
</main>
{% endblock %}
