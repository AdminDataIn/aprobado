{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo enviado - Marketplace</title>
    {% include "account/_auth_content_styles.html" %}
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #122340 0%, #08101d 72%);
        }
    </style>
</head>
<body>
    <main class="section-main">
        <section class="hero-section-account">
            <div class="container-account">
                <div class="div-card-agent-account is-status-card">
                    <div class="auth-status-icon">✉</div>
                    <div class="mb-3">
                        <span class="badge rounded-pill border">Correo enviado</span>
                    </div>

                    <h1>Revisa tu correo</h1>
                    <p class="auth-desc">Si el correo está registrado, recibirás un enlace para restablecer tu contraseña en los próximos minutos.</p>

                    <div class="auth-footer-links is-centered">
                        <a href="{% url 'marketplace:login' %}">← Volver al login</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
