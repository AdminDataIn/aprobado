{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Marketplace</title>
    {% include "account/_auth_content_styles.html" %}
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #122340 0%, #08101d 72%);
        }
    </style>
</head>
<body>
    <main class="section-main">
        <section class="hero-section-account">
            <div class="container-account">
                <div class="div-card-agent-account is-status-card">
                    <div class="auth-status-icon">✉</div>
                    <div class="mb-3">
                        <span class="badge rounded-pill border">Recuperación de acceso</span>
                    </div>

                    <h1>Recupera tu contraseña</h1>
                    <p class="auth-desc">Ingresa tu correo y te enviaremos un enlace seguro para restablecer el acceso al panel marketplace.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="auth-field">
                            <label for="id_email" class="form-label">Correo electrónico</label>
                            <input type="email" name="email" id="id_email" placeholder="tu@empresa.com" required autofocus>
                        </div>
                        <button type="submit" class="btn-account">Enviar enlace de recuperación</button>
                    </form>

                    <div class="auth-footer-links is-centered">
                        <a href="{% url 'marketplace:login' %}">← Volver al login</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
