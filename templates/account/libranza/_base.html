{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acceso Libranza{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    {% block extra_head %}{% endblock %}
    <style>
        .auth-flow-shell .hero-section-account {
            min-height: 100vh !important;
            height: auto !important;
            padding: 2.5rem 1rem !important;
        }
    </style>
</head>
<body class="auth-body auth-flow-shell {% block body_class %}{% endblock %}">
{% include 'base/loader_global.html' %}
{% block content %}{% endblock %}
{% include 'base/public_whatsapp_button.html' %}
{% block extra_scripts %}{% endblock %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="{% static 'js/global_loader.js' %}"></script>
</body>
</html>
