{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Documento de identidad | Aprobado</title>
  <link rel="stylesheet" href="{% static 'css/captura_documental.css' %}?v=id01b-camera">
</head>
<body class="capture-page">
<main data-capture-mobile {% if capture_grant %}data-capture-grant{% endif %} data-base="{{ capture_base }}" data-contexto="{{ solicitud_id }}">
  <img src="{% static 'images/logo-dark.png' %}" width="160" alt="Aprobado">
  <h1>Documento de identidad</h1>
  <p>Captura ambas caras de tu documento. Las fotos se envían de forma privada a tu solicitud.</p>
  <div data-mobile-controls>
    {% csrf_token %}
    <p class="camera-step" data-camera-step>1 de 2 · Frontal</p>
    <h2 data-camera-title>Frente del documento</h2>
    <p class="camera-hint" data-camera-hint>Usa buena luz y evita reflejos. Mantén visibles las cuatro esquinas.</p>
    <div class="camera-viewfinder" data-viewfinder hidden>
      <video data-camera-video autoplay muted playsinline aria-label="Vista de la cámara"></video>
      <div class="camera-guide" aria-hidden="true"></div>
    </div>
    <img class="camera-preview" data-camera-preview alt="Foto del documento para revisar" hidden>
    <div class="camera-actions">
      <button type="button" data-canjear>Abrir cámara</button>
      <button type="button" data-tomar-foto hidden>Tomar foto</button>
      <button type="button" class="camera-secondary" data-repetir hidden>Repetir</button>
      <button type="button" data-usar-foto hidden>Usar esta foto</button>
      <button type="button" data-finalizar hidden>Finalizar captura</button>
    </div>
  </div>
  <p class="camera-status" role="status" aria-live="polite" aria-atomic="true" data-capture-status></p>
  <noscript>Activa JavaScript y abre este enlace en un navegador compatible con cámara.</noscript>
</main>
<script src="{% static 'js/captura_documental.js' %}?v=id01b-grant" defer></script>
</body>
</html>
