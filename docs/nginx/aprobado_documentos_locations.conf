# PROPUESTA: incluir dentro de cada server Aprobado, no en fundetec-staging.
# Sustituye los locations /media/ anteriores; no agregarlos duplicados.
location ^~ /_protected_legacy/ {
    internal;
    alias /var/www/aprobado/media/;
    disable_symlinks on;
    autoindex off;
    expires off;
    etag off;
    if_modified_since off;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /media/marketplace/items/ {
    alias /var/www/aprobado/media/marketplace/items/;
    disable_symlinks on;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /media/marketplace/logos/ {
    alias /var/www/aprobado/media/marketplace/logos/;
    disable_symlinks on;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /media/ {
    expires off;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    return 404;
}
