# Include once in http context. Literal values keep the logged host and class safe.
map $host $aprobado_id00_host {
    default "";
    aprobado.com.co aprobado.com.co;
    emprender.aprobado.com.co emprender.aprobado.com.co;
    contratistas.aprobado.com.co contratistas.aprobado.com.co;
    market.aprobado.com.co market.aprobado.com.co;
}

map $uri $aprobado_id00_clase {
    default "";
    ~^/media/marketplace/(?:items|logos)/ "";
    ~^/captura-documental(?:/|$) captura;
    ~^/_protected_legacy(?:/|$) entrega_interna;
    ~^/media(?:/|$) media_legacy;
    ~^/api/pagares/download(?:/|$) descarga_temporal;
    ~(?:^|/)documentos(?:/|$) documento;
}

map "$aprobado_id00_host:$aprobado_id00_clase" $aprobado_id00_log_documental {
    default 0;
    ~^[a-z.]+:[a-z_]+$ 1;
}

map $aprobado_id00_log_documental $aprobado_id00_log_ordinario {
    0 1;
    1 0;
}

map $request_method $aprobado_id00_metodo {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}

# No raw URI, query string, request line, client address or incoming headers.
log_format aprobado_id00_documental 'ID00 $request_id $aprobado_id00_metodo $status $request_time $aprobado_id00_host $aprobado_id00_clase';
