# Include once in http context. Match the normalized URI, not the query string.
map $uri $aprobado_id00_log_documental {
    default 0;
    ~^/media/marketplace/(?:items|logos)/ 0;
    ~^/(?:captura-documental|_protected_legacy|media)(?:/|$) 1;
    ~(?:^|/)documentos(?:/|$) 1;
    ~^/api/pagares/download(?:/|$) 1;
}

map $aprobado_id00_log_documental $aprobado_id00_log_ordinario {
    0 1;
    1 0;
}

# No client-supplied fields, addresses, URI, query string or headers.
log_format aprobado_id00_documental 'ID00 $request_id $status $body_bytes_sent $request_time';
