worker_processes 1;
pid /tmp/id00-nginx.pid;
error_log /var/log/nginx/error.log;

events { worker_connections 32; }

http {
    include /id00/aprobado_documental_log_http.conf;
    access_log /var/log/nginx/access.log combined;
    include /tmp/id00-vhosts.conf;

    # Synthetic authorization stub. Real roles are covered by the Django suite.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location / {
            if ($http_x_fixture_role != 'owner') { return 404; }
            add_header X-Accel-Redirect /_protected_legacy/fixture-id00.pdf;
            return 200;
        }
    }
}
