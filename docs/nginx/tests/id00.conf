worker_processes 1;
pid /tmp/id00-nginx.pid;
error_log /var/log/nginx/error.log;

events { worker_connections 32; }

http {
    include /id00/aprobado_documental_log_http.conf;

    server {
        listen 127.0.0.1:8080;
        include /id00/aprobado_documental_log_server.conf;
        include /id00/aprobado_documentos_locations.conf;

        location = /documentos/libranza/0/cedula_frontal/ {
            proxy_pass http://127.0.0.1:8081;
        }
        location /captura-documental/ { return 404; }
        location /api/pagares/download/ { return 404; }
        location / { return 200 'ORDINARIO'; }
    }

    # Synthetic authorization stub. Real roles are covered by the Django suite.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location / {
            if ($http_x_fixture_owner != 'yes') { return 404; }
            add_header X-Accel-Redirect /_protected_legacy/fixture-id00.pdf;
            return 200;
        }
    }
}
