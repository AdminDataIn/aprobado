server {
    listen 127.0.0.1:80;
    server_name aprobado.com.co www.aprobado.com.co emprender.aprobado.com.co contratistas.aprobado.com.co market.aprobado.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name www.aprobado.com.co;
    include /id00/tests/id00.tls.conf;
    return 301 https://aprobado.com.co$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name aprobado.com.co;
    include /id00/tests/id00.tls.conf;
    include /id00/tests/aprobado_protected_legacy.conf;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name emprender.aprobado.com.co;
    include /id00/tests/id00.tls.conf;
    include /id00/tests/aprobado_protected_legacy.conf;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name contratistas.aprobado.com.co;
    include /id00/tests/id00.tls.conf;
    include /id00/tests/aprobado_protected_legacy.conf;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name market.aprobado.com.co;
    include /id00/tests/id00.tls.conf;
    include /id00/tests/aprobado_protected_legacy.conf;
}
