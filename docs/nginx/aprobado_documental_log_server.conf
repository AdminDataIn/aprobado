# Include in the four approved HTTPS servers and their HTTP-to-HTTPS server.
# Preserve the inherited combined log for non-documental traffic.
access_log /var/log/nginx/access.log combined if=$aprobado_id00_log_ordinario;
access_log /var/log/nginx/access.log aprobado_id00_documental if=$aprobado_id00_log_documental;
